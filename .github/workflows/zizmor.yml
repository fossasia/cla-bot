name: "GitHub Actions Security Analysis with zizmor"

# Reusable workflow, called from ci.yml (that is what makes it part of the
# single "Required checks pass" gate). No push / pull_request / schedule
# triggers of its own (they would run this check twice) and no
# `concurrency:` (inside a reusable workflow `github.workflow` is the
# CALLER's name, which would collide with ci.yml's group and get the run
# cancelled). `workflow_dispatch` is kept only to re-run it by hand.
on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  # Pin the exact release to avoid silent changes; bump manually when needed.
  # Last checked: 2026-09-11.
  ZIZMOR_VERSION: "1.30.1"

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # required for upload-sarif to publish results to the Security tab
      contents: read # only strictly needed if this repo is ever made private
      actions: read # only strictly needed if this repo is ever made private
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv itself is pinned AND checksum-verified. Without `version`, setup-uv
      # installs whatever uv is newest, and for a version it has no built-in
      # checksum for it skips verification entirely, so a compromised uv
      # release could tamper with zizmor's result (and turn this required
      # check green). With `version` + `checksum` the run fails closed if the
      # downloaded archive differs by even one byte.
      #
      # `checksum` is the SHA-256 of the uv-x86_64-unknown-linux-gnu.tar.gz
      # release asset (ubuntu-latest is x86_64); it is published next to the
      # asset as `<asset>.sha256` on the uv release page. Dependabot cannot
      # bump these two values, so update them together by hand:
      #   V=<new uv version>
      #   curl -fsSL "https://github.com/astral-sh/uv/releases/download/$V/uv-x86_64-unknown-linux-gnu.tar.gz.sha256"
      # test/ci-gate.test.js fails if `version` is not exact or `checksum` is
      # missing / not a SHA-256. Last checked: 2026-10-05.
      #
      # `enable-cache: false`: nothing here benefits from a uv cache, and
      # restoring one would let a poisoned cache entry influence a security check.
      - name: Install uv (pinned and checksum-verified)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          checksum: "fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63"
          enable-cache: false

      - name: Run zizmor
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: zizmor

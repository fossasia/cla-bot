name: "GitHub Actions Security Analysis with zizmor"

# Reusable workflow, called from ci.yml (that is what makes it part of the
# single "Required checks pass" gate). No push / pull_request / schedule
# triggers of its own (they would run this check twice) and no
# `concurrency:` (inside a reusable workflow `github.workflow` is the
# CALLER's name, which would collide with ci.yml's group and get the run
# cancelled). `workflow_dispatch` is kept only to re-run it by hand.
on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  # Pin the exact release to avoid silent changes; bump manually when needed.
  # Last checked: 2026-09-11.
  ZIZMOR_VERSION: "1.30.1"

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # required for upload-sarif to publish results to the Security tab
      contents: read # only strictly needed if this repo is ever made private
      actions: read # only strictly needed if this repo is ever made private
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv itself is pinned AND checksum-verified. Without `version`, setup-uv
      # installs whatever uv is newest, and for a version it has no built-in
      # checksum for it skips verification entirely, so a compromised uv
      # release could tamper with zizmor's result (and turn this required
      # check green). With `version` + `checksum` the run fails closed if the
      # downloaded archive differs by even one byte.
      #
      # `checksum` is the SHA-256 of the uv-x86_64-unknown-linux-gnu.tar.gz
      # release asset (ubuntu-latest is x86_64); it is published next to the
      # asset as `<asset>.sha256` on the uv release page. Dependabot cannot
      # bump these two values, so update them together by hand:
      #   V=<new uv version>
      #   curl -fsSL "https://github.com/astral-sh/uv/releases/download/$V/uv-x86_64-unknown-linux-gnu.tar.gz.sha256"
      # test/ci-gate.test.js fails if `version` is not exact or `checksum` is
      # missing / not a SHA-256. Last checked: 2026-10-05.
      #
      # `enable-cache: false`: nothing here benefits from a uv cache, and
      # restoring one would let a poisoned cache entry influence a security check.
      - name: Install uv (pinned and checksum-verified)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          checksum: "fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63"
          enable-cache: false

      # Two runs on purpose, because zizmor's exit code depends on the format:
      #  * `--format=sarif` ALWAYS exits 0, findings or not. It is only used
      #    to feed the Security tab, so `--no-exit-codes` is passed explicitly
      #    (a real tool failure - crash, bad config - still fails the step).
      #  * the "Fail on findings" step below is the actual gate: any finding
      #    makes zizmor exit non-zero (11-14 by severity), which turns this
      #    job - and therefore "Required checks pass" - red. `--format=github`
      #    also prints each finding as an inline annotation on the PR.
      - name: Run zizmor (SARIF for code scanning)
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=sarif --no-exit-codes . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests from forks and from Dependabot get a read-only token, so
      # the upload cannot get `security-events: write` there and fails for a
      # reason that has nothing to do with the code under test. Findings are
      # still enforced by the next step, so on pull_request the upload is
      # best-effort; on push / schedule / manual runs (trusted token) a failed
      # upload still fails the job.
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          sarif_file: results.sarif
          category: zizmor

      # `!cancelled()` so findings are still reported and enforced even if the
      # best-effort upload above failed (it would otherwise skip this step).
      - name: Fail on findings
        if: ${{ !cancelled() }}
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=github .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

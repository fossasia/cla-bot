name: "GitHub Actions Security Analysis with zizmor"

# Reusable security check. ci.yml owns its triggers and concurrency.
on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  # Pin the reviewed zizmor release.
  ZIZMOR_VERSION: "1.30.1"

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # required for upload-sarif to publish results to the Security tab
      contents: read # only strictly needed if this repo is ever made private
      actions: read # only strictly needed if this repo is ever made private
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin and verify uv. Update version and checksum together from the uv
      # release page; test/ci-gate.test.js checks the pin. Keep cache disabled.
      - name: Install uv (pinned and checksum-verified)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          checksum: "fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63"
          enable-cache: false

      # SARIF output does not fail on findings. The next step is the gate;
      # this step only uploads findings to GitHub's Security tab.
      - name: Run zizmor (SARIF for code scanning)
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=sarif --no-exit-codes . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fork and Dependabot tokens may not upload security events. The next
      # step enforces findings, so make this upload best-effort on PRs.
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          sarif_file: results.sarif
          category: zizmor

      # Enforce findings even if the best-effort upload failed.
      - name: Fail on findings
        if: ${{ !cancelled() }}
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=github .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Test Coverage

# This workflow is the actual enforcement gate: it fails the job (and
# therefore the PR's status check) whenever coverage is below 100%. It
# deliberately runs with read-only, no-secret permissions so it's safe to
# execute on pull requests from forks - see coverage-comment.yml for how the
# human-readable PR comment gets posted from a separate, privileged workflow
# instead of from here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to a commit SHA, not a tag - tags can be repointed later, a
      # SHA can't. Check https://github.com/actions/checkout/releases before
      # bumping this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Deliberately split into two steps. Running `c8 npm test` in one go
      # would collapse two very different failures - "a test failed" and
      # "the tests all passed but coverage is below 100%" - into the same
      # non-zero exit, so a broken test would get reported to the
      # contributor as a coverage problem. Here the test run explicitly
      # opts out of the threshold check (`--check-coverage=false`) and
      # fails the job immediately on a genuine test failure, while the
      # threshold is asserted separately further down.
      - name: Run tests
        run: npm run test:coverage-nocheck

      # Captured rather than failing straight away so the human-readable
      # report still gets built, summarised and uploaded first; it's turned
      # back into a real job failure by the last step.
      - name: Check coverage threshold
        id: coverage
        continue-on-error: true
        run: npm run coverage:check

      - name: Build PR comment from the coverage report
        if: always()
        continue-on-error: true
        run: npm run coverage:report

      # Written directly into this job's own summary (not just stdout) so
      # the exact missing lines/functions/branches are easy to find even
      # when the separate comment workflow can't post them - notably on the
      # very PR that first introduces coverage.yml, before it exists on the
      # default branch, workflow_run (see coverage-comment.yml) has nothing
      # to trigger off yet.
      - name: Add coverage report to the job summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f coverage/pr-comment.md ]; then
            cat coverage/pr-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Uploaded as an artifact (not posted directly) because this job's
      # GITHUB_TOKEN is intentionally read-only - see coverage-comment.yml,
      # which runs with pull-requests:write and picks this up via
      # workflow_run to actually post/update the comment.
      - name: Upload coverage report for the comment workflow
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-pr-comment
          path: |
            coverage/pr-comment.md
            coverage/pr-comment-meta.json
          if-no-files-found: warn
          retention-days: 14

      # Reaching this step at all means every test passed (the "Run tests"
      # step above would have failed the job otherwise), so this really is
      # a coverage shortfall and the message can say so unambiguously.
      - name: Enforce coverage threshold
        if: steps.coverage.outcome == 'failure'
        run: |
          echo "::error::All tests passed, but coverage is below the required 100% - see the job summary above (or the PR comment, once this workflow exists on the default branch) for exactly which lines, statements, functions and branches are missing, or run 'npm run coverage' locally."
          exit 1

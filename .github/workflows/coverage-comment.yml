name: Post Coverage Comment

# Split out from coverage.yml on purpose. coverage.yml is now a reusable
# workflow called from ci.yml, which runs on `pull_request` and therefore
# only ever gets a read-only, secret-less GITHUB_TOKEN when triggered by a
# fork PR (GitHub's own security default) - not enough to post a comment.
# This workflow instead triggers on `workflow_run` after the CI run
# finishes (note: it listens for the workflow named "CI", not "Test
# Coverage" - coverage.yml's runs are now part of the caller's "CI" run),
# which runs in the base repo's context with real permissions, and its only
# job is to read the report *artifact* (one Markdown file, not code) that
# coverage.yml already built and post it. This is the standard safe pattern
# for commenting from untrusted PRs -
# see https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# Which PR gets the comment, and whether the report is still current, are
# decided from this event's own payload - never from the artifact. See the
# TRUST BOUNDARY notes in .github/scripts/post-coverage-comment.js.
#
# Note for future maintainers: `workflow_run` always executes the version
# of *this* workflow file that's on the default branch, regardless of what
# a PR changes - so edits here only take effect once merged to main. If
# ci.yml's `name:` is ever renamed, update `workflows:` below to match.
on:
  # zizmor flags workflow_run as a dangerous trigger by default because it's
  # frequently misused to run privileged code against untrusted PR input.
  # This job never does that: it only ever checks out this repo's own
  # default-branch scripts and reads one Markdown artifact as inert data
  # (see post-coverage-comment.js) - it never checks out, evals, or executes
  # anything from the triggering pull request. Verified safe per
  # https://docs.zizmor.sh/audits/#dangerous-triggers.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]

permissions: {}

# Keyed by the head repo + branch rather than a PR number, because
# workflow_run.pull_requests is EMPTY for fork PRs - keying on it would
# leave every fork run in its own group.
#
# cancel-in-progress is deliberately FALSE: jobs for one branch must run one
# at a time, never overlap. With true, a cancelled job can still be mid-way
# through reading and then writing the comment while its replacement starts,
# which is exactly the read-then-write interleaving the freshness checks in
# post-coverage-comment.js are trying to avoid. Queued (not yet started)
# runs are still collapsed by GitHub to the newest one. The head-SHA checks
# and the run-number tag in that script make the order jobs happen to run in
# irrelevant.
concurrency:
  group: coverage-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post coverage comment
    # CI also runs on push, schedule and manual dispatch; only the
    # pull_request-triggered runs produce a PR-shaped report with a PR to
    # comment on.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to check out our own trusted script
      pull-requests: write # to create/update the sticky coverage comment
      actions: read # to download an artifact from a different workflow run
    steps:
      # Only used to fetch our own trusted comment-posting script - this
      # checks out whatever is on the default branch (workflow_run never
      # uses a PR's version of this workflow or its scripts), never
      # anything from the pull request itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download coverage report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: coverage-artifact

      # Deliberately NOT conditional on the download: when the coverage job
      # produced no report (tests failed, job crashed ...) the script still
      # runs and replaces the previous commit's comment with a "report
      # unavailable" notice, instead of leaving an outdated "100%" on the PR.
      # The script itself skips runs that are no longer current (superseded
      # or cancelled by a newer push).
      - name: Post or update the sticky PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/post-coverage-comment.js`);
            await script({ github, context, core });

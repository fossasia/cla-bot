name: Post Coverage Comment

# Posts the report artifact after CI with write access. The artifact is
# untrusted; the script gets the PR and tested commit from the event payload.
# workflow_run uses this file from the default branch. Keep `workflows` in
# sync with ci.yml's name.
on:
  # This job runs trusted scripts and treats the PR report as data only.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]

permissions: {}

# Use the head repository and branch because fork runs may not include a PR
# number. Do not cancel active runs; the script checks report freshness.
concurrency:
  group: coverage-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post coverage comment
    # Only PR runs have a report that belongs in a PR comment.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to check out our own trusted script
      pull-requests: write # to create/update the sticky coverage comment
      actions: read # to download an artifact from a different workflow run
    steps:
      # Check out the trusted default-branch script only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download coverage report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: coverage-artifact

      # Run even without a report so the script can mark it unavailable.
      - name: Post or update the sticky PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/post-coverage-comment.js`);
            await script({ github, context, core });

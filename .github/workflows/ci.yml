name: CI

# ONE entry point for every pull-request check in this repository.
#
# The checks live in their own files (actionlint.yml, zizmor.yml, codeql.yml,
# coverage.yml) as *reusable workflows* and are called from here, next to the
# inline `test` job. The last job, `required-checks-pass`, fans in all of
# them via `needs:`. It is the ONLY status check branch protection has to
# require (see .github/rulesets/README.md), so adding, removing or renaming
# a check never means touching repo Settings again.
#
# To add a check: add a job below, then add its id to `needs:` of
# `required-checks-pass`. test/ci-gate.test.js fails the build if you forget.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run of everything, so new advisories/lint rules surface even when
  # nobody is pushing. Replaces the per-workflow crons the checks used to
  # have on their own.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# The ONE concurrency group for the whole gate. The called (reusable)
# workflows must NOT declare their own: inside a reusable workflow
# `github.workflow` resolves to the CALLER's name ("CI"), so a same-looking
# group there would collide with this one and GitHub would cancel the run.
# See https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
# Only pull_request runs are cancelled on supersede; push/schedule runs on
# main always run to completion so main keeps a full set of results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 18/20 are past End-of-Life (see package.json's engines field). 22
        # is current Maintenance LTS, 24 is Active LTS - testing both catches
        # anything that only breaks on the newer runtime early.
        node-version: ["22", "24"]
    steps:
      # Pinned to a commit SHA, not a tag - tags can be repointed later, a
      # SHA can't. Check https://github.com/actions/checkout/releases before
      # bumping this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We only read our own code to run our own tests; no later step
          # needs a live git credential sitting on disk.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # package-lock.json pins js-yaml (used below, only to validate
      # action.yml) to an exact version. `npm ci` installs exactly what's
      # locked instead of resolving fresh, and `--ignore-scripts` stops any
      # dependency from running install-time scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: node --check src/cla-bot.js

      - name: Run unit tests
        run: npm test

      - name: Validate action.yml structure
        run: |
          node -e "
            const yaml = require('js-yaml');
            const fs = require('fs');
            const doc = yaml.load(fs.readFileSync('action.yml', 'utf8'));
            if (typeof doc !== 'object' || doc === null) {
              throw new Error('action.yml did not parse to an object');
            }
            for (const key of ['name', 'description', 'inputs', 'runs']) {
              if (!(key in doc)) throw new Error('Missing required top-level key: ' + key);
            }
            // A raw substring check would pass this even if 'runs:' only
            // showed up inside a string value - parsing properly avoids that.
            const isPlainObject = (v) =>
              typeof v === 'object' && v !== null && !Array.isArray(v);

            if (!isPlainObject(doc.inputs)) {
              throw new Error('inputs must be a mapping of input name to its spec');
            }

            if (!isPlainObject(doc.runs) || typeof doc.runs.using !== 'string') {
              throw new Error('runs must be a top-level mapping with a string using field');
            }
            const VALID_USING = ['composite', 'node16', 'node18', 'node20', 'node22', 'node24', 'docker'];
            if (!VALID_USING.includes(doc.runs.using)) {
              throw new Error('runs.using must be one of: ' + VALID_USING.join(', ') + ' (got ' + doc.runs.using + ')');
            }
            if (doc.runs.using === 'composite') {
              if (!Array.isArray(doc.runs.steps) || doc.runs.steps.length === 0) {
                throw new Error('composite actions must define a non-empty runs.steps array');
              }
            } else if (doc.runs.using === 'docker') {
              if (typeof doc.runs.image !== 'string' || !doc.runs.image) {
                throw new Error('docker actions must define a runs.image string');
              }
            } else {
              // node16/node18/node20/node22/node24
              if (typeof doc.runs.main !== 'string' || !doc.runs.main) {
                throw new Error('JavaScript actions must define a runs.main string');
              }
            }
            console.log('action.yml is valid YAML with the required structure');
          "

  # The four checks below are called as `./.github/workflows/<file>.yml`,
  # not with GitHub's newer self-repository form (`$/.github/workflows/...`,
  # which zizmor's `self-repository` audit prefers as a "help"-level, not
  # blocking, suggestion). `./` is used deliberately: actionlint v1.7.12
  # (also a gate here, via actionlint.yml) rejects `$/` outright, while `./`
  # is understood by it, works on every runner/GHES version, and for a
  # `pull_request` run resolves to the very commit under test. Each `uses:`
  # below is annotated to suppress that one low-severity zizmor suggestion;
  # switch to `$/` once actionlint supports it (the failing linter will
  # tell you when that is safe).
  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: ./.github/workflows/actionlint.yml # zizmor: ignore[self-repository]

  zizmor:
    name: zizmor
    permissions:
      contents: read # checkout (and private-repo support)
      actions: read # only needed if the repo is ever private
      security-events: write # upload SARIF; a called workflow can only keep or lower these
    uses: ./.github/workflows/zizmor.yml # zizmor: ignore[self-repository]

  codeql:
    name: codeql
    permissions:
      contents: read # checkout
      actions: read # CodeQL reads workflow run metadata
      security-events: write # upload CodeQL results
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]

  coverage:
    name: coverage
    permissions:
      contents: read
    uses: ./.github/workflows/coverage.yml # zizmor: ignore[self-repository]

  # >>> The ONLY job to mark as a required status check in branch protection. <<<
  # (Its check name is exactly "Required checks pass" - see
  # .github/rulesets/main.json and .github/rulesets/README.md.)
  #
  # - `if: always()` is essential. Without it this job is SKIPPED, not
  #   failed, whenever a dependency fails - and GitHub treats a skipped
  #   required check as passing, which would silently turn the whole gate
  #   green exactly when something broke.
  # - The check is an allow-list: every needed job must be exactly `success`.
  #   `failure`, `cancelled` and `skipped` all fail the gate, so a job that
  #   someone later gates behind an `if:` cannot quietly stop being enforced.
  # - The needs JSON goes through an environment variable, never straight
  #   into the script text, so there is nothing to inject into.
  # - Keep this job free of `if:` conditions other than always(), and keep
  #   `needs` equal to every other job in this file.
  #   test/ci-gate.test.js enforces both.
  required-checks-pass:
    name: Required checks pass
    if: ${{ always() }}
    needs: [test, actionlint, zizmor, codeql, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "### Required checks"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS_JSON"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$NEEDS_JSON" >/dev/null; then
            echo "::error::A required job failed, was cancelled, or was skipped. A skipped job counts as a failure here on purpose. See the table above and the failing job's logs."
            exit 1
          fi
          echo "All required jobs succeeded."

name: "CodeQL Advanced Analysis"

# Reusable workflow, called from ci.yml (that is what makes it part of the
# single "Required checks pass" gate). No push / pull_request / schedule
# triggers of its own (they would run it twice) and no `concurrency:`
# (inside a reusable workflow `github.workflow` is the CALLER's name, which
# would collide with ci.yml's group and get the run cancelled).
# `workflow_dispatch` is kept only to re-run it by hand.
#
# NOTE: a green job here means "the analysis ran and its results were
# uploaded", NOT "no alerts": CodeQL does not fail the job on findings, so
# "Required checks pass" does not block a merge on new CodeQL alerts by
# itself. That is a deliberate default, not an oversight - see "Optional:
# block on CodeQL alerts" in .github/rulesets/README.md for how to turn
# that on as a separate, explicit ruleset rule.
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      security-events: write # upload CodeQL results
      actions: read # CodeQL reads workflow run metadata

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

name: "FOSSASIA CLA Bot"
description: "Self-written, dependency-free CLA automation for FOSSASIA repositories."
author: "FOSSASIA"
branding:
  icon: "check-square"
  color: "blue"

inputs:
  github-token:
    description: >-
      Token for comments, statuses, and PR locking, usually secrets.GITHUB_TOKEN.
      Grant it issues: write, pull-requests: read, statuses: write, and
      contents: read. Without a GitHub App, it also needs contents: write when
      the signatures repo is this repository.
    required: true
  signatures-owner:
    description: "Org/user owning the central signatures repo, e.g. fossasia"
    required: true
  signatures-repo:
    description: "Name of the private central signatures repo, e.g. cla-signatures"
    required: true
  signatures-path:
    description: >-
      Relative path to the signature JSON file. It cannot start or end with
      "/", contain empty, ".", "..", or ".git" segments, or include "#", "?",
      backslash, control characters (except trailing ASCII whitespace), or "%".
      A leading "./" and trailing ASCII whitespace (tab through carriage
      return and space) are ignored.
      Leading whitespace is part of the path. Spaces and non-ASCII characters
      are encoded.
    required: false
    default: "signatures/cla.json"
  cla-document-url:
    description: "Full URL to the CLA text contributors must read before signing"
    required: true
  allowlist:
    description: >-
      Comma or whitespace separated numeric GitHub account ids. Usernames and
      wildcards are not accepted. Invalid entries fail the run. Find an id with
      `gh api users/NAME --jq .id`.
    required: false
    default: ""
  app-id:
    description: >-
      Positive decimal GitHub App ID for short-lived signature-write tokens.
      Set this together with app-private-key. Leave both empty to use
      github-token; this only works when both repositories are the same.
    required: false
    default: ""
  app-private-key:
    description: >-
      GitHub App private key in PEM format. Store it as a secret and set it
      together with app-id.
    required: false
    default: ""
  node-version:
    description: "Node.js version for the bot. Must be 22 or later. Defaults to 22."
    required: false
    default: "22"
  require-verified-commits:
    description: >-
      When true, trust the author only if that account is also the verified
      committer. Otherwise flag the commit for manual review, even if the
      author has signed. Defaults to false.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Pin Node explicitly so self-hosted runners use the supported runtime.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run CLA bot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SIG_OWNER: ${{ inputs.signatures-owner }}
        SIG_REPO: ${{ inputs.signatures-repo }}
        SIG_PATH: ${{ inputs.signatures-path }}
        CLA_DOCUMENT_URL: ${{ inputs.cla-document-url }}
        ALLOWLIST: ${{ inputs.allowlist }}
        SIG_APP_ID: ${{ inputs.app-id }}
        SIG_APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        REQUIRE_VERIFIED_COMMITS: ${{ inputs.require-verified-commits }}
        CLA_BOT_EVENT_PR_NUMBER: ${{ toJSON(github.event.issue.number || github.event.pull_request.number) }}
        CLA_BOT_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CLA_BOT_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/src/cla-bot.js"

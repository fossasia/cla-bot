# Copy this tested workflow to .github/workflows/cla.yml and fill in the
# `with:` values for your repository.
#
# Use a published, verified release. See "Verifying a release" in
# SECURITY.md and the release steps in CONTRIBUTING.md.
#
# Use the full commit SHA resolved ONCE during the
# verification procedure in SECURITY.md. Keep the version in the trailing
# comment. Do not resolve the tag again after verification. Dependabot and
# Renovate update both together.
#
# See SETUP_GUIDE.md for the GitHub App, signatures repo, and secrets setup.

name: "CLA Bot"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    # Retargets arrive as "edited" events. The bot checks changes.base and
    # ignores title and body edits.
    types: [opened, synchronize, reopened, closed, edited]

# Required for reading PRs and commits, posting comments, locking PRs, and
# setting the CLA status. The workflow does not write repository contents.
permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

# Serialize events for each PR so concurrent runs cannot overwrite newer
# signature or status results.
#
# Keep up to 100 runs queued. Without this, a newer event can replace a
# pending signing run before it records the signature.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      # Replace the placeholder SHA and version with a verified release.
      - name: Run CLA bot
        uses: fossasia/cla-bot@REPLACE_WITH_THE_FULL_COMMIT_SHA_OF_THE_RELEASE # vX.Y.Z
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          signatures-owner: fossasia
          signatures-repo: cla-signatures
          signatures-path: signatures/cla.json
          cla-document-url: https://github.com/fossasia/cla-signatures/blob/main/CLA.md
          # Use numeric GitHub account ids. Look them up with
          # `gh api 'users/NAME[bot]' --jq .id`.
          allowlist: |
            41898282
            49699333
            29139614
          # 41898282 = github-actions[bot]
          # 49699333 = dependabot[bot]
          # 29139614 = renovate[bot]
          # App credentials for writing to the signatures repo. Scope these
          # org secrets to selected repositories; see SETUP_GUIDE.md.
          app-id: ${{ secrets.CLA_APP_ID }}
          app-private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
